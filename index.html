<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すまいるくらぶ作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style id="pageSize">@page{size:A4;margin:0}</style>
<style>
:root{--bg:#f3eee5;--panel:#fbf8f2;--ink:#232323;--wood:#AD8A5C;--line:#e1d6c4;--muted:#6b6256;--field:#ffffff;--warn:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--panel:#26231f;--ink:#ece6dc;--wood:#c9a678;--line:#3b352d;--muted:#a59c8f;--field:#1f1d1a;--warn:#f2857c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Yu Gothic","游ゴシック",YuGothic,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#232323;color:#f3eee5}
.top h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.04em}
.top .sp{flex:1}.top .st{font-size:12px;opacity:.75}
.btn{border:1px solid var(--wood);background:transparent;color:inherit;padding:7px 14px;border-radius:4px;cursor:pointer}
.btn:hover{background:rgba(173,138,92,.15)}
.btn.pri{background:var(--wood);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--wood);outline-offset:1px}
.app{display:grid;grid-template-columns:440px 1fr;height:calc(100% - 56px)}
.editor{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px 18px 60px}
.sec{border-bottom:1px solid var(--line);padding:16px 0}
.sec h2{display:flex;align-items:baseline;gap:10px;font-size:15px;margin:0 0 12px}
.sec h2 .n{font-size:22px;color:var(--wood);font-weight:700;font-family:Georgia,serif}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;flex:1;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],select,textarea{background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:56px;line-height:1.5}
input[type=range]{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:12px}
.tab{flex:1;padding:8px;border:1px solid var(--line);background:transparent;border-radius:4px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .w{color:var(--warn);font-size:12px;margin-left:4px}.tab.on .w{color:#ffb4ab}
.card{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--field)}
.card.on{border-color:var(--wood)}
.ch{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.ch .ty{font-size:11px;background:var(--wood);color:#fff;padding:2px 6px;border-radius:3px;white-space:nowrap}
.ch .ti{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.ch .sz{font-size:11px;color:var(--muted);white-space:nowrap}
.cb{padding:4px 10px 10px;border-top:1px dashed var(--line)}
.ops{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.grp{border-left:3px solid var(--line);padding-left:8px;margin:10px 0}
.grp>b{font-size:12px;display:block;margin-bottom:6px;color:var(--muted)}
.phin{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.phin .th{width:56px;height:42px;border:1px solid var(--line);border-radius:3px;background:var(--bg) center/cover no-repeat;flex:none}
.help{font-size:12px;color:var(--muted);line-height:1.6;margin:4px 0 8px}
.add{display:flex;gap:6px;margin-top:10px}
.preview{overflow:auto;padding:28px 24px;position:relative}
.pages{display:flex;flex-wrap:wrap;gap:30px;justify-content:center;align-items:flex-start}
.pv{position:relative;flex:none}
.pv .lbl{position:absolute;top:-20px;left:0;font-size:12px;color:var(--muted)}
.pv .ov{position:absolute;top:-22px;right:0;font-size:12px;color:#fff;background:var(--warn);padding:1px 8px;border-radius:3px;display:none}
.pv.over .ov{display:block}
.pv .sheet{transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18)}

/* ===== 紙面 ===== */
.sheet{width:210mm;height:297mm;background:var(--paper,#fff);color:#1d1d1d;padding:7mm;display:flex;flex-direction:column;gap:2.5mm;font-family:"Noto Sans JP","Yu Gothic",sans-serif;font-size:8.5pt;line-height:1.55;overflow:hidden}
.flow{flex:1;min-height:0;display:flex;flex-direction:column;gap:2.5mm;overflow:hidden}
.rw{display:grid;grid-template-columns:1fr;gap:2.5mm;min-height:0;flex:none}
.rw.two{grid-template-columns:1fr 1fr}
.rw.fill{flex:1 1 0}
.blk{position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;cursor:pointer;height:100%}
.blk.fr-square{border:.35mm solid #333;padding:2.5mm;background:var(--card,#fff)}
.blk.fr-round{border:.35mm solid #333;border-radius:3.5mm;padding:3mm;background:var(--card,#fff)}
.blk.fs-s{font-size:7.5pt}.blk.fs-m{font-size:8.5pt}.blk.fs-l{font-size:10pt}
.blk:hover{outline:1.5px dashed #AD8A5C;outline-offset:1px}
.txt{white-space:pre-wrap}
.ph{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.ph-empty{background:#e9e6e1;color:#9a948b;display:flex;align-items:center;justify-content:center;font-size:9pt}
.qr{width:16mm;height:16mm;display:block;image-rendering:pixelated}
.qrbox{display:flex;flex-direction:column;align-items:center;font-size:6.5pt;gap:.5mm;flex:none;text-align:center;line-height:1.3}
.wk-sat{color:#1f5fbf}.wk-sun{color:#d0202e}
.wk{font-size:.55em}
.serif{font-family:"Noto Serif JP","Yu Mincho",serif}

/* ヘッダー */
.mast{background:var(--head,transparent);margin:-7mm -7mm 0;padding:7mm 7mm 2.5mm;display:grid;grid-template-columns:auto 1fr auto;gap:5mm;align-items:start;padding-bottom:1mm}
.yu{width:24mm}
.pm{width:23mm;height:23mm;border:.35mm solid #111;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2;color:#111;background:#fff}
.pm.circle{border-radius:50%}
.pm .po{font-size:7.5pt}
.pm .ln{width:72%;border-top:.3mm solid #111;margin:1.2mm 0 1.4mm}
.pm .kn{font-size:9.5pt;font-weight:700;letter-spacing:.06em}
.pm .ym{font-size:8.5pt;margin-top:1mm}
.ttl{text-align:center}
.ttl .sc{font-family:"Noto Serif JP",Georgia,serif;font-weight:700;font-size:25pt;line-height:1.1;letter-spacing:.01em}
.ttl .no{font-size:7.5pt;letter-spacing:.06em;margin-top:.5mm}
.sns{display:flex;justify-content:center;gap:4mm;margin-top:1.5mm}
.sns .qrbox{flex-direction:row;gap:1mm;font-weight:700}
.sns .qr{width:11mm;height:11mm}
.co{font-size:6.8pt;line-height:1.45;max-width:72mm}
.co .logo{height:14mm;width:auto;max-width:70mm;display:block;margin-bottom:1.8mm}
.co .lt{font-weight:900;font-size:13pt;line-height:1.02;margin-bottom:1.5mm;white-space:pre-line}

/* 見学会:写真に文字を重ねる */
.hero{position:relative;flex:1;min-height:0;overflow:hidden;background:#dfe6ee}
.hero>.ph{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0 0 auto 0;height:62%;background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.55) 60%,rgba(255,255,255,0))}
.hero.lt .shade{background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.25) 60%,rgba(0,0,0,0))}
.hero .hc{position:absolute;inset:4mm 5mm auto 5mm;display:grid;grid-template-columns:auto 1fr;gap:3mm 7mm;align-items:start}
.hero.lt .hc{color:#fff}
.hero .kind{font-size:.95em;font-weight:700}
.hero .lab{font-weight:900;font-size:24pt;line-height:1;letter-spacing:-.01em;margin:.5mm 0}
.hero .dt{font-weight:900;font-size:30pt;line-height:1.05;letter-spacing:-.01em}
.hero .tt{font-family:"Noto Serif JP",serif;font-weight:700;font-size:15pt;line-height:1.35;white-space:pre-wrap}
.hero .inf{white-space:pre-wrap;margin-top:1.5mm;font-size:.95em;font-weight:500}
.hero .hb{position:absolute;left:3mm;right:3mm;bottom:3mm;display:flex;gap:3mm;align-items:flex-end}
.hero .bd{flex:1;background:rgba(255,255,255,.88);border-radius:2mm;padding:2mm 3mm;white-space:pre-wrap;font-size:.9em}
.hero .bd:empty{visibility:hidden}
.hero .hb .qrbox{background:#fff;padding:1.5mm;border-radius:1.5mm}
/* 見学会:標準 */
.ohs-top{display:flex;align-items:flex-end;justify-content:space-between;gap:3mm}
.ohs-top .lab{font-weight:900;font-size:20pt;line-height:1}
.ohs-top .dt{font-weight:900;font-size:20pt;line-height:1}
.ohs-tt{font-family:"Noto Serif JP",serif;font-weight:700;font-size:1.3em;margin:1.5mm 0;white-space:pre-wrap}
.ohs-main{flex:1;min-height:0;display:grid;grid-template-columns:1.7fr 1fr;gap:3mm}
.half .ohs-main{grid-template-columns:1fr;grid-template-rows:1fr auto}

/* 記事・イベント共通 */
.c-bar{color:#fff;font-weight:900;font-size:1.4em;padding:1.5mm 3mm;line-height:1.3;white-space:pre-wrap;text-align:center;flex:none}
.c-line{font-weight:900;font-size:1.3em;line-height:1.35;border-bottom:.6mm solid;padding-bottom:1mm;white-space:pre-wrap;flex:none}
.c-center{font-family:"Noto Serif JP",serif;font-weight:700;font-size:1.3em;line-height:1.45;text-align:center;white-space:pre-wrap;flex:none}
.c-sub{font-family:"Noto Serif JP",serif;font-weight:700;font-size:1.3em;text-align:center;margin-top:1mm;white-space:pre-wrap;flex:none}
.c-date{font-weight:900;font-size:1.5em;text-align:center;margin-top:1mm;flex:none}
.c-main{flex:1;min-height:0;display:grid;gap:2.5mm;margin-top:2mm}
.c-main.pl-right{grid-template-columns:1fr 1fr}
.c-main.pl-left{grid-template-columns:1fr 1fr}
.c-main.pl-left .phs{order:-1}
.c-main.pl-top{grid-template-rows:1fr auto}
.c-main.pl-bottom{grid-template-rows:auto 1fr}
.c-main.pl-bottom .phs{order:2}
.c-main.np{grid-template-columns:1fr;grid-template-rows:1fr}
.half .c-main.pl-right,.half .c-main.pl-left{grid-template-columns:1fr;grid-template-rows:1fr auto}
.half .c-main.pl-right .phs,.half .c-main.pl-left .phs{order:-1}
.c-tx{display:flex;gap:3mm;align-items:flex-end;min-height:0;overflow:hidden}
.c-tx>.tc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.5mm}
.info{border-top:.3mm solid;padding-top:1.5mm;white-space:pre-wrap;font-size:.95em}
.info>span{color:#1d1d1d}
.phs{display:grid;gap:1.5mm;min-height:0}
.phs.n2{grid-template-columns:1fr 1fr}
.phs.n3{grid-template-columns:1fr 1fr;grid-template-rows:1.4fr 1fr}
.phs.n3>:first-child{grid-column:1/-1}
.phs.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.c-main.pl-top .phs.v2,.c-main.pl-bottom .phs.v2{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
/* 帯 */
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:2mm 4mm}
.bn .t{font-weight:900;font-size:15pt;line-height:1.3;white-space:pre-wrap}
.bn .s{font-size:9pt;white-space:pre-wrap;margin-top:1mm}
/* モデルハウス */
.mh{flex:1;min-height:0;display:flex;flex-direction:column;gap:2mm}
.mh.bb{flex-direction:column-reverse}
.mh-bar{display:flex;align-items:center;gap:5mm;color:#fff;padding:2mm 5mm;flex:none}
.mh-bar .tc{flex:1;text-align:center}
.mh-bar .t{font-family:"Noto Serif JP",serif;font-weight:700;font-size:13pt;line-height:1.3}
.mh-bar .s{font-size:8pt}
.mh-bar .tel{font-weight:900;font-size:14pt;margin-left:3mm}
.mh-bar .qrbox{flex-direction:row;gap:2mm;font-size:7pt}
.mh-bar .qr{background:#fff;padding:.8mm;width:14mm;height:14mm}
.mh-cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5mm}
.half .mh-cols{grid-template-columns:1fr}
.mh-cols{grid-template-rows:minmax(0,1fr) auto auto auto}
.mh-c{display:grid;grid-row:span 4;grid-template-rows:subgrid;min-height:0}
.mh-c .phw{min-height:0}
.half .mh-cols{grid-template-rows:none;grid-auto-rows:auto}
.half .mh-c{display:flex;flex-direction:column;grid-row:auto}
.half .mh-c .phw{flex:1}
.mh-c .d{font-size:.88em;text-align:center;margin-top:1mm;line-height:1.35;white-space:pre;font-weight:700;align-self:end;overflow:hidden}
.mh-c .nm{font-size:.88em;text-align:center;line-height:1.35;white-space:pre;font-weight:700;overflow:hidden}
.mh-c .a{font-size:.82em;margin-top:.8mm;white-space:pre;padding-left:2mm;overflow:hidden}
/* 建設中 */
.cs-bar{color:#fff;display:flex;align-items:baseline;gap:4mm;padding:1.5mm 4mm;flex:none}
.cs-bar .t{font-weight:700;font-size:11pt}
.cs-bar .n{font-size:6.3pt;margin-left:auto}
.cs-main{flex:1;min-height:0;display:grid;grid-template-columns:1.3fr 1fr;gap:2.5mm;margin-top:1.5mm}
.half .cs-main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
.cs-main.np{grid-template-columns:1fr}
.cs-l{min-height:0;overflow:hidden}
.cs-tb{border-collapse:collapse;width:100%;font-size:.86em}
.cs-tb th{text-align:justify;text-align-last:justify;white-space:nowrap;vertical-align:top;padding:1mm 3mm 1mm 0;font-weight:500;width:1%}
.cs-tb td{padding:1mm 0;border-bottom:.2mm dashed #999;line-height:1.5}
.cs-tb tr:last-child td{border-bottom:0}
.cs-i{display:inline-block;margin-right:2.5mm}
.cs-ph{position:relative;min-height:0}
.cs-ph .cap{position:absolute;left:0;top:0;background:rgba(255,255,255,.85);font-size:6.5pt;padding:.3mm 1.5mm}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:8px;padding:20px;width:min(460px,92vw);max-height:80vh;overflow:auto}
.mbox h3{margin:0 0 12px;font-size:16px}
.ilist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.ilist button{text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--field);border-radius:6px;cursor:pointer}
.ilist button:hover{border-color:var(--wood)}
.ilist small{color:var(--muted);margin-left:8px}
.top .sh{font-size:12px;padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.12)}
.top .sh.dirty{background:#b3261e;color:#fff}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}.editor{border-right:0;border-bottom:1px solid var(--line)}}
@media print{
  html,body{background:#fff;height:auto}
  .top,.editor,.pv .lbl,.pv .ov{display:none!important}
  .app{display:block;height:auto}.preview{padding:0;overflow:visible}.pages{display:block}
  .pv{width:auto!important;height:auto!important;break-after:page;page-break-after:always}
  .pv:last-child{break-after:auto;page-break-after:auto}
  .pv .sheet{transform:none!important;box-shadow:none}
  body.bleed .pv{padding:3mm;background:var(--paper,#fff)}
  .blk:hover{outline:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.upd{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#232323;color:#f3eee5;padding:10px 14px 10px 18px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center;z-index:60;font-size:13px}
.upd[hidden]{display:none}
.upd button{background:#AD8A5C;color:#fff;border:0;border-radius:4px;padding:6px 12px;cursor:pointer;font:inherit}
@media print{.upd{display:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>すまいるくらぶ作成ツール</h1>
  <span class="st" id="saveSt"></span>
  <span class="sp"></span>
  <span class="sh" id="fileSt" hidden></span>
  <button class="btn" data-act="openFile">ファイルを開く</button>
  <button class="btn" data-act="saveFile">上書き保存</button>
  <a class="btn" href="label.html" style="text-decoration:none">宛名ラベル</a>
  <button class="btn" data-act="nextIssue">次の号を作成</button>
  <button class="btn pri" data-act="print">印刷・PDF保存</button>
</header>
<div class="app">
  <aside class="editor" id="editor"></aside>
  <main class="preview" id="previewPane"><div class="pages" id="pages"></div></main>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<div class="upd" id="upd" hidden>ツールが新しくなりました。<button type="button" id="updBtn">最新版に切り替える</button></div>
<script>
/* ============ 定数 ============ */
const MONTHS=[1,3,5,7,9];
const TYPES={openhouse:'見学会',article:'記事',event:'イベント',banner:'帯・見出し',modelhouse:'モデルハウス',construction:'建設中一覧'};
const COLORS={black:['黒','#232323'],navy:['紺','#1f3a68'],red:['赤','#c62d3a'],green:['緑','#2f7a52'],wood:['木','#8a5a2b'],sky:['水色','#2d86b0'],pink:['ピンク','#d0567a'],orange:['オレンジ','#e07a1f']};
const POS={top:'上',center:'中央',bottom:'下'};
const FRAMES={none:'なし',square:'四角',round:'角丸'};
const THEMES={standard:['白(標準)','#ffffff','#ffffff','#ffffff'],sora:['空色','#eef5fb','#cfe3f3','#ffffff'],kinari:['生成り','#f7f1e6','#ece0c8','#fffdf8'],wakaba:['若草','#f1f6ec','#d9e9cc','#ffffff'],sakura:['桜','#fbf0f2','#f3d6dd','#ffffff'],aki:['秋色','#f8efe6','#e8cdb2','#fffaf5'],yuki:['冬・グレー','#f1f2f4','#dadde3','#ffffff']};
const defTheme=()=>({preset:'standard',paper:'#ffffff',head:'#ffffff',card:'#ffffff'});
/* 号数:2026年9月号(No.281)までは月ごとに+1、それ以降は発行ごとに+1(1・3・5・7・9月) */
const issueIdx=(y,m)=>(+y)*5+MONTHS.indexOf(+m);
const calcNo=(y,m)=>{if(+y<2026||(+y===2026&&+m<=9))return 275+(+y-2026)*12+(+m-3);const i=MONTHS.indexOf(+m);return i<0?'':281+issueIdx(y,m)-issueIdx(2026,9)};
const uid=()=>'b'+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ============ ブロック雛形 ============ */
const DEF={
  openhouse:{style:'hero',tone:'dark',color:'black',fill:true,kind:'長期優良住宅 完成見学会',date:'9/12(土)・13(日)',title:'「タイトルを入力」',
    info:'時間 AM10:00〜PM4:00\n場所 \n工法 \n☎予約:027-386-3432',body:'',qr:'',qrcap:'WEB予約\nQRコード',photos:[null]},
  article:{frame:'round',ts:'center',pl:'top',title:'記事の見出し',sub:'',date:'',body:'',info:'',qr:'',qrcap:'',n:1,photos:[null,null,null]},

function exportJson(){const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download=defName();document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function saveFile(as){
  if(!canFS){exportJson();return}
  try{
    if(!fh||as){fh=await window.showSaveFilePicker({suggestedName:defName(),types:FTYPES});DB.set('fileHandle',fh).catch(()=>{})}
    if((await fh.queryPermission({mode:'readwrite'}))!=='granted'&&(await fh.requestPermission({mode:'readwrite'}))!=='granted')throw new Error('ファイルへの書き込みが許可されませんでした。');
    $('#saveSt').textContent='ファイルに保存中…';
    const w=await fh.createWritable();await w.write(JSON.stringify(S));await w.close();
    ui.fileDirty=false;fileStatus();$('#saveSt').textContent='ファイルに保存しました';
  }catch(e){if(e.name==='AbortError')return;$('#saveSt').textContent='';alert('ファイルに保存できませんでした。\n'+e.message)}
}
async function openFile(){
  if(ui.fileDirty&&!confirm('ファイルに保存していない変更があります。保存せずに別のファイルを開きますか？'))return;
  if(!canFS){$('#importFile').click();return}
  try{
    const [h]=await window.showOpenFilePicker({types:FTYPES});
    const d=JSON.parse(await (await h.getFile()).text());if(!d.pages||!d.meta)throw new Error('このツールで保存したファイルではありません。');
    delete d.remote;S=load(d);fh=h;DB.set('fileHandle',h).catch(()=>{});
    ui.fileDirty=false;ui.page=0;save(false);renderEditor();renderPreview();fileStatus();$('#saveSt').textContent='ファイルを開きました';
  }catch(e){if(e.name==='AbortError')return;alert('ファイルを開けませんでした。\n'+e.message)}
}

/* ============ QR ============ */
const qrCache={};
function qr(url){
  if(!url||typeof QRCode==='undefined')return null;
  if(qrCache[url])return qrCache[url];
  const el=document.createElement('div');
  try{new QRCode(el,{text:url,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});
    const c=el.querySelector('canvas');qrCache[url]=c?c.toDataURL():(el.querySelector('img')||{}).src}catch(e){return null}
  return qrCache[url];
}
const qrBox=(url,label)=>{const d=qr(url);return d?`<div class="qrbox"><img class="qr" src="${d}" alt="QRコード">${label?`<span class="txt">${esc(label)}</span>`:''}</div>`:''};

const acc=b=>(COLORS[b.color]||COLORS.black)[1];
/* 日付の(土)(日)を色付きの小さめ文字に */

        <div class="mh-cols">${b.models.map(m=>`<div class="mh-c"><div class="phw">${ph(m.photo,b.pos)}</div>${(()=>{const ls=String(m.desc||'').split('\n');const nm=ls.length>1?ls.pop():'';return `<div class="d">${esc(ls.join('\n'))}</div><div class="nm">${esc(nm)}</div>`})()}<div class="a">${esc(m.addr)}</div></div>`).join('')}</div></div>`;break;
    case 'construction':

        <div class="cs-main ${b.n?'':'np'}"><div class="cs-l fitchk"><table class="cs-tb">${b.stages.filter(s=>s.list.trim()).map(s=>`<tr><th>${esc(s.name)}</th><td>${s.list.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>`<span class="cs-i">◎${esc(x)}</span>`).join('')}</td></tr>`).join('')}</table></div>${b.n?photosHtml(b.photos,b.n,b.pos,true):''}</div>`;break;

/* 全幅は1行、半分幅は2つずつ横並び */
function toRows(blocks){const out=[];for(let i=0;i<blocks.length;){const b=blocks[i];if(!b.full&&blocks[i+1]&&!blocks[i+1].full){out.push([b,blocks[i+1]]);i+=2}else{out.push([b]);i++}}return out}
function renderRows(blocks){
  return toRows(blocks).map(r=>{const fill=r.some(b=>b.fill);const h=Math.max(...r.map(b=>b.h));const two=r.length>1||!r[0].full;
    return `<div class="rw ${two?'two':''} ${fill?'fill':''}" style="${fill?'':`height:${h}mm`}">${r.map(renderBlock).join('')}</div>`}).join('');
}
function renderPreview(){
  const pane=$('#previewPane'),w=pane.clientWidth;
  const s=w>=1150?Math.min(1,(w-80)/(2*794)):Math.min(1,(w-48)/794);
  $('#pages').innerHTML=S.pages.map((blocks,i)=>`
    <div class="pv" style="width:${794*s}px;height:${1123*s}px;--paper:${S.theme.paper};--head:${S.theme.head};--card:${S.theme.card}"><span class="lbl">${i?'裏面':'表面'}</span><span class="ov">はみ出しています</span>
      <div class="sheet" style="transform:scale(${s})">${i===0?renderMast():''}<div class="flow">${renderRows(blocks)}</div></div></div>`).join('');
  document.body.classList.toggle('bleed',!!S.meta.bleed);
  $('#pageSize').textContent=S.meta.bleed?'@page{size:216mm 303mm;margin:0}':'@page{size:A4;margin:0}';
  fitText();fitModelText();checkOverflow();
}
/* 文字サイズ「自動」:枠に収まるまで縮小 */
function blockOver(el){
  if(el.scrollHeight>el.clientHeight+1)return true;
  if([...el.querySelectorAll('.fitchk')].some(x=>x.scrollHeight>x.clientHeight+1))return true;
  return [...el.querySelectorAll('.phs>.ph,.phs>.cs-ph')].some(x=>x.clientHeight<34);
}
function fitText(){
  document.querySelectorAll('.blk.fs-auto').forEach(el=>{for(const s of [9.5,9,8.5,8,7.5,7,6.5]){el.style.fontSize=s+'pt';if(!blockOver(el))break}});
}
function fitModelText(){
  document.querySelectorAll('.mh-cols').forEach(g=>{['d','nm','a'].forEach(k=>{const els=[...g.querySelectorAll('.mh-c>.'+k)];if(!els.length)return;
    els.forEach(e=>e.style.fontSize='');let fs=parseFloat(getComputedStyle(els[0]).fontSize);
    const over=()=>els.some(e=>e.scrollWidth>e.clientWidth+1);
    while(over()&&fs>5){fs-=.25;els.forEach(e=>e.style.fontSize=fs+'px')}})})
}
function checkOverflow(){
  ui.over=[...document.querySelectorAll('.pv')].map(pv=>{
    const f=pv.querySelector('.flow');let o=f.scrollHeight>f.clientHeight+2;
    pv.querySelectorAll('.rw.fill').forEach(r=>{if(r.clientHeight<60)o=true});
    pv.querySelectorAll('.blk').forEach(b=>{if(blockOver(b))o=true});
    pv.classList.toggle('over',o);return o});
  document.querySelectorAll('.tab[data-page]').forEach(t=>{const w=t.querySelector('.w');if(w)w.textContent=ui.over[+t.dataset.page]?'はみ出し':''});
}
const schedulePreview=()=>{clearTimeout(pvT);pvT=setTimeout(renderPreview,120)};

const inp=(scope,path,val,label,kind='text',extra='')=>{
  const a=`data-scope="${scope}" data-path="${path}" ${extra}`;
  const f=kind==='textarea'?`<textarea ${a} rows="3">${esc(val)}</textarea>`:`<input type="${kind}" ${a} value="${esc(val)}">`;
  return `<label class="f"><span>${label}</span>${f}</label>`;
};
const sel=(scope,path,val,label,opts,extra='')=>`<label class="f"><span>${label}</span><select data-scope="${scope}" data-path="${path}" ${extra}>${Object.entries(opts).map(([k,v])=>`<option value="${k}" ${String(k)===String(val)?'selected':''}>${v}</option>`).join('')}</select></label>`;
const photoIn=(bid,path,src,label)=>`<div class="phin"><div class="th" style="${src?`background-image:url(${src})`:''}"></div><label class="f" style="margin:0"><span>${label}</span><input type="file" accept="image/*" data-photo="${path}" data-bid="${bid}"></label>${src?`<button class="btn sm" data-act="clearPhoto" data-bid="${bid}" data-path="${path}">外す</button>`:''}</div>`;

  const nSel=max=>sel('block','n',b.n,'写真の枚数',Object.fromEntries([...Array(max+1).keys()].map(i=>[i,i+'枚'])),`${D} data-num="1" data-struct="1"`);
  const pics=max=>nSel(max)+b.photos.slice(0,b.n).map((p,i)=>photoIn(b.id,'photos.'+i,p,'写真'+(i+1))).join('');
  switch(b.type){
    case 'openhouse':return `<div class="row">${sel('block','style',b.style,'見せ方',{hero:'写真に文字を重ねる',standard:'写真と文字を分ける'},D+' data-struct="1"')}${b.style==='hero'?sel('block','tone',b.tone,'文字色',{dark:'黒文字(明るい写真)',light:'白文字(暗い写真)'},D):''}</div>`+
      B('kind',b.kind,'見学会の種類(例:長期優良住宅 完成見学会)')+B('date',b.date,'日程(例:9/12(土)・13(日))')+B('title',b.title,'タイトル','textarea')+B('info',b.info,'時間・場所・工法・予約','textarea')+B('body',b.body,'説明文・特徴(写真の下に表示)','textarea')+B('qr',b.qr,'予約ページURL(QR)','url')+B('qrcap',b.qrcap,'QRの説明','textarea')+photoIn(b.id,'photos.0',b.photos[0],'メイン写真');
    case 'article':case 'event':return `<div class="row">${sel('block','ts',b.ts,'見出しの形',{center:'中央・明朝',bar:'色帯',line:'下線'},D)}${b.n?sel('block','pl',b.pl,'写真の位置',{top:'上',bottom:'下',right:'右',left:'左'},D):''}</div>`+
      B('title',b.title,'見出し','textarea')+B('sub',b.sub,'サブ見出し(例:「回遊できる中庭中心の平屋」)')+B('date',b.date,'日時(大きく表示)')+B('body',b.body,'本文','textarea')+B('info',b.info,'日程・会場・お問い合わせ(線の下に表示)','textarea')+B('qr',b.qr,'QRコードにするURL','url')+B('qrcap',b.qrcap,'QRの説明','textarea')+pics(b.type==='event'?4:3);
    case 'banner':return B('title',b.title,'見出し','textarea')+B('sub',b.sub,'補足','textarea');
    case 'modelhouse':return sel('block','bar',b.bar,'見出し帯の位置',{top:'上',bottom:'下'},D)+B('title',b.title,'見出し')+B('sub',b.sub,'営業時間')+B('tel',b.tel,'予約電話')+B('qr',b.qr,'予約ページURL(QR)','url')+B('qrcap',b.qrcap,'QRの説明','textarea')+
      b.models.map((m,i)=>`<div class="grp"><b>モデルハウス${i+1}</b>${B(`models.${i}.desc`,m.desc,'紹介文・名称','textarea')}${B(`models.${i}.addr`,m.addr,'所在地・構造','textarea')}${photoIn(b.id,`models.${i}.photo`,m.photo,'写真')}</div>`).join('');
    case 'construction':return B('title',b.title,'見出し')+B('note',b.note,'補足')+
      `<div class="grp"><b>イニシャルで追加</b><div class="help">読み(カナまたはローマ字)を入れると「T.A様邸 伊勢崎市」の形で追加します。</div>

  }
  return '';

    ${h.yu?`<div class="row">${H('postOffice',h.postOffice,'差出郵便局名(例:沼田局。空欄なら省略)')}${sel('header','yuShape',h.yuShape,'形',{square:'四角',circle:'丸'})}</div>`:''}
    ${H('title',h.title,'タイトル')}
    ${H('qrHome',h.qrHome,'ホームページURL(QR)','url')}${H('qrInsta',h.qrInsta,'InstagramのURL(QR)','url')}${H('qrLine',h.qrLine,'LINEのURL(QR)','url')}
    <div class="phin"><div class="th" style="background-image:url(${h.logo||LOGO});background-size:contain"></div><label class="f" style="margin:0"><span>ロゴ(別の画像に替える場合のみ選択)</span><input type="file" accept="image/*" data-photo="logo" data-scope="header"></label>${h.logo?'<button class="btn sm" data-act="clearLogo">標準ロゴに戻す</button>':''}</div>
    ${H('company',h.company,'会社情報','textarea')}
  </section>
  <section class="sec"><h2><span class="n">04</span>紙面</h2>
    <div class="tabs"><button class="tab ${ui.page===0?'on':''}" data-act="page" data-page="0">表面<span class="w"></span></button><button class="tab ${ui.page===1?'on':''}" data-act="page" data-page="1">裏面<span class="w"></span></button></div>
    <p class="help">紙面のブロックをクリックすると編集欄が開きます。「高さ自動」のブロックが余白を埋めるので、情報が少ない月も多い月も高さを細かく合わせる必要はありません。半分幅のブロックは2つ続けると横に並びます。</p>
    ${blocks.map((b,i)=>blockCard(b,ui.page,i,blocks.length)).join('')||'<p class="help">ブロックがありません。下から追加してください。</p>'}
    <div class="add"><select id="addType" style="flex:1">${addOpts}</select><button class="btn pri" data-act="add">ブロックを追加</button></div>
  </section>
  <section class="sec"><h2><span class="n">05</span>保存・出力</h2>
    ${sel('meta','order',m.order,'イニシャルの順番',{gf:'名.姓(青木 太郎 → T.A)',fg:'姓.名(青木 太郎 → A.T)'})}
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" data-scope="meta" data-path="bleed" ${m.bleed?'checked':''}>塗り足し3mmを付ける(プリントパック入稿用・216×303mm)</label>
    <p class="help">印刷画面で「送信先:PDFに保存」「余白:なし」「背景のグラフィック:オン」にするとPDFになります。</p>
    <div class="row"><button class="btn pri" data-act="print">印刷・PDF保存</button></div>
    <div class="row"><button class="btn" data-act="saveFile">上書き保存</button><button class="btn" data-act="saveAs">名前を付けて保存</button><button class="btn" data-act="openFile">ファイルを開く</button></div>
    <p class="help">作業中の内容は、写真も含めてこのパソコンのブラウザに自動保存されるので、画面を閉じても翌日そのまま続きから作れます。<br>あわせて、号ごとに「名前を付けて保存」で共有フォルダ(Zドライブなど)にファイルとして保存しておくと、控えになるほか、別のパソコンや別の担当者に引き継ぐこともできます。2回目からは「上書き保存」(Ctrl+S)で同じファイルに保存されます。</p>
    <button class="btn sm" data-act="reset">サンプルに戻す</button>
  </section>`;
  checkOverflow();
}

/* ============ ユーティリティ ============ */
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
function findBlock(id){for(let p=0;p<2;p++){const i=S.pages[p].findIndex(b=>b.id===id);if(i>=0)return{p,i,b:S.pages[p][i]}}return null}
function compress(file,max=1800){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');const png=/png/.test(file.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL(png?'image/png':'image/jpeg',.86))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const KMAP={A:'アァ',I:'イィ',U:'ウゥ',E:'エェ',O:'オォヲ',K:'カキクケコ',G:'ガギグゲゴ',S:'サシスセソ',Z:'ザズゼゾヅ',J:'ジヂ',T:'タツテト',C:'チ',D:'ダデド',N:'ナニヌネノ',H:'ハヒヘホ',F:'フ',B:'バビブベボ',P:'パピプペポ',M:'マミムメモ',Y:'ヤユヨャュョ',R:'ラリルレロ',W:'ワ',V:'ヴ'};
function initial(s){s=(s||'').trim();if(!s)return'';let c=s[0];if(/[a-z]/i.test(c))return c.toUpperCase();const n=c.charCodeAt(0);if(n>=0x3041&&n<=0x3096)c=String.fromCharCode(n+0x60);for(const[k,v]of Object.entries(KMAP))if(v.includes(c))return k;return null}
function nextIssue(){const m=S.meta;fh=null;DB.set('fileHandle',null).catch(()=>{});ui.fileDirty=false;setTimeout(fileStatus);const i=MONTHS.indexOf(+m.month);if(i===MONTHS.length-1||i<0){m.year=+m.year+1;m.month=1}else m.month=MONTHS[i+1];m.noAuto=true;m.no=calcNo(m.year,m.month)}

/* ============ イベント ============ */
const ed=$('#editor');
ed.addEventListener('input',e=>{
  const t=e.target,sc=t.dataset.scope;if(!sc||t.type==='file'||t.type==='checkbox')return;
  let v=t.value;if(t.dataset.num)v=v===''?'':+v;if(t.dataset.bool)v=v==='1';
  const obj=sc==='meta'?S.meta:sc==='header'?S.header:sc==='theme'?S.theme:findBlock(t.dataset.bid)?.b;if(!obj)return;
  setPath(obj,t.dataset.path,v);
  if(sc==='theme'){if(t.dataset.path==='preset'&&THEMES[v]){const th=THEMES[v];Object.assign(S.theme,{paper:th[1],head:th[2],card:th[3]})}else if(t.dataset.path!=='preset'){S.theme.preset='custom';const ps=ed.querySelector('[data-scope="theme"][data-path="preset"]');if(ps)ps.value='custom'}}
  if(sc==='meta'&&(t.dataset.path==='year'||t.dataset.path==='month')&&S.meta.noAuto){S.meta.no=calcNo(S.meta.year,S.meta.month);const n=$('#noIn');if(n)n.value=S.meta.no}
  if(sc==='meta'&&t.dataset.path==='no'){S.meta.noAuto=false;const c=ed.querySelector('[data-path="noAuto"]');if(c)c.checked=false}
  if(t.dataset.path==='h'){ed.querySelectorAll(`[data-bid="${t.dataset.bid}"][data-path="h"]`).forEach(x=>{if(x!==t)x.value=v});const sz=$(`#card-${t.dataset.bid} .sz`);if(sz)sz.textContent=(obj.full?'全幅':'半分')+'・'+v+'mm'}
  if(t.dataset.struct)renderEditor();
  save();schedulePreview();
});
ed.addEventListener('change',async e=>{
  const t=e.target;
  if(t.type==='checkbox'&&t.dataset.scope){const sc=t.dataset.scope;const obj=sc==='meta'?S.meta:sc==='header'?S.header:findBlock(t.dataset.bid)?.b;setPath(obj,t.dataset.path,t.checked);
    if(sc==='meta'&&t.dataset.path==='noAuto'&&t.checked)S.meta.no=calcNo(S.meta.year,S.meta.month);
    if(sc==='block'||sc==='header'||t.dataset.path==='noAuto')renderEditor();save();renderPreview();return}
  if(t.type==='file'&&t.files[0]){
    try{const d=await compress(t.files[0],t.dataset.scope==='header'?900:1800);
      if(t.dataset.scope==='header')S.header.logo=d;else setPath(findBlock(t.dataset.bid).b,t.dataset.photo,d);
      save();renderEditor();renderPreview()}catch(err){alert('画像を読み込めませんでした。JPEGかPNGの画像を選んでください。')}
  }
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){const blk=e.target.closest('.blk');if(blk){const f=findBlock(blk.dataset.bid);if(f){ui.page=f.p;S.pages.flat().forEach(b=>b.open=false);f.b.open=true;renderEditor();$('#card-'+f.b.id)?.scrollIntoView({behavior:'smooth',block:'start'})}}return}
  const a=el.dataset.act,f=el.dataset.bid?findBlock(el.dataset.bid):null;
  const arr=f?S.pages[f.p]:null;
  switch(a){
    case 'toggle':f.b.open=!f.b.open;renderEditor();return;
    case 'page':ui.page=+el.dataset.page;renderEditor();return;
    case 'up':[arr[f.i-1],arr[f.i]]=[arr[f.i],arr[f.i-1]];break;
    case 'down':[arr[f.i+1],arr[f.i]]=[arr[f.i],arr[f.i+1]];break;
    case 'move':arr.splice(f.i,1);S.pages[1-f.p].push(f.b);f.b.open=false;break;
    case 'dup':{const c=clone(f.b);c.id=uid();arr.splice(f.i+1,0,c);break}
    case 'del':if(!confirm(`「${TYPES[f.b.type]}」ブロックを削除しますか？`))return;arr.splice(f.i,1);break;
    case 'clearPhoto':setPath(f.b,el.dataset.path,null);break;
    case 'clearLogo':S.header.logo=null;break;
    case 'add':{S.pages[ui.page].forEach(b=>b.open=false);const v=$('#addType').value;
      const b=v.startsWith('p:')?mk(PRESETS[v.slice(2)][0],PRESETS[v.slice(2)][2]):mk(v);b.open=true;
      S.pages[ui.page].push(b);save();renderEditor();renderPreview();$('#card-'+b.id)?.scrollIntoView({behavior:'smooth',block:'start'});return}
    case 'addInitial':{
      const card=el.closest('.grp');const g=k=>card.querySelector(`[data-ini="${k}"]`);
      const fi=initial(g('fam').value),gi=initial(g('giv').value);
      if(fi===null||gi===null||!fi){alert('姓・名の読みは、カナまたはローマ字で入力してください。');return}
      const name=gi?(S.meta.order==='gf'?`${gi}.${fi}`:`${fi}.${gi}`):fi;
      const st=f.b.stages[+g('stage').value];const city=g('city').value.trim();
      st.list=(st.list.trim()?st.list.trim()+'\n':'')+`${name}様邸${city?' '+city:''}`;break}
    case 'nextIssue':if(!confirm('次の号(1・3・5・7・9月)に切り替えます。紙面の内容はそのまま引き継ぐので、書き換えて使ってください。\n(今の号をファイルに保存していない場合は、先に「上書き保存」してください)'))return;nextIssue();break;
    case 'print':renderPreview();setTimeout(()=>window.print(),300);return;
    case 'export':exportJson();return;case 'exportOld':{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(blob);const x=document.createElement('a');x.href=u;x.download=`すまいるくらぶ_${S.meta.year}${String(S.meta.month).padStart(2,'0')}_No${S.meta.no}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return}
    case 'import':$('#importFile').click();return;
    case 'reset':if(!confirm('いまの内容を消してサンプルに戻します。必要なら先に「名前を付けて保存」で控えを取ってください。'))return;S=sampleState();fh=null;DB.set('fileHandle',null).catch(()=>{});ui.fileDirty=false;fileStatus();break;
    case 'saveFile':saveFile(false);return;
    case 'saveAs':saveFile(true);return;
    case 'openFile':openFile();return;
    default:return;
  }
  save();renderEditor();renderPreview();
});
function load(d){if(d.header&&!d.header.logo)d.header.logo=null;const rm=d.remote;d.theme=Object.assign(defTheme(),d.theme||{});d.pages=d.pages.map(p=>p.map(migrate));d.header=Object.assign(sampleState().header,d.header);if(rm)d.remote=rm;return d}
$('#importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pages||!d.meta)throw 0;delete d.remote;S=load(d);save();fileStatus();renderEditor();renderPreview()}catch(err){alert('このファイルは読み込めません。このツールで書き出したJSONファイルを選んでください。')}e.target.value=''};r.readAsText(file)});
window.addEventListener('resize',schedulePreview);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile(false)}});
window.addEventListener('beforeprint',()=>{document.querySelectorAll('.pv .sheet').forEach(s=>s.style.transform='none')});
window.addEventListener('afterprint',renderPreview);

(async()=>{
  await restoreHandle();
  try{S=await DB.get('current')}catch(e){S=null}
  S=S&&S.v===2?load(S):sampleState();
  renderEditor();renderPreview();fileStatus();
  if(document.fonts)document.fonts.ready.then(()=>{fitText();fitModelText();checkOverflow()});
})();

/* ============ 自動更新チェック(GitHub Pagesで開いている場合) ============ */
const APP_VERSION='2026.10.22-1';
async function checkUpdate(){
  if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(location.pathname+'?vc='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const m=(await r.text()).match(/const APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION)document.getElementById('upd').hidden=false;}catch(e){}
}
document.getElementById('updBtn').onclick=()=>location.replace(location.pathname+'?v='+Date.now());
setTimeout(checkUpdate,3000);setInterval(checkUpdate,30*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
</script>
</body>
